name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate HTML
        run: npm run validate:html

      - name: Lint CSS
        run: npm run validate:css

      - name: Lint JS
        run: npm run validate:js

      - name: Run unit tests
        run: npm test

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (excluding visual regression)
        run: npx playwright test --project=chromium --ignore-snapshots e2e/navigation.spec.js e2e/a11y.spec.js e2e/contact.spec.js
