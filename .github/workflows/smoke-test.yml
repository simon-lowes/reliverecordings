name: Smoke Test

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate HTML
        run: npm run validate:html

      - name: Lint JS
        run: npm run validate:js

      - name: Run unit tests
        run: npm test

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test - page loads
        run: npx playwright test e2e/navigation.spec.js --project=chromium
